<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Travers'n Spaces</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: Terminus;
            src: url("assets/fonts/TerminusTTF-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: Terminus;
            src: url("assets/fonts/TerminusTTF-Bold.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            font-family: Terminus, "Terminus TTF", "IBM Plex Mono", ui-monospace, monospace;
            font-size: 16px;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
            font-smooth: never;
            color: #eee;
            overflow: hidden;
        }

        .desktop {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Layer 1: wallpaper */
        .wallpaper {
            position: absolute;
            inset: 0;
            background: #000 url("assets/Img7_Congo_Square_Nola.jpg") right center / cover no-repeat;
            filter: brightness(0.42) saturate(0.8) contrast(1.15);
            transform: scale(1.04);
        }

        /* Layer 2: CRT / computer-screen overlay */
        .crt,
        .crt::before,
        .crt::after {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .crt {
            z-index: 2;
            box-shadow: inset 0 0 140px 50px rgba(0, 0, 0, 0.72);
        }

        .crt::before {
            content: "";
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.035) 0px,
                rgba(255, 255, 255, 0.035) 1px,
                transparent 1px,
                transparent 3px
            );
            mix-blend-mode: overlay;
            animation: scan 8s linear infinite;
        }

        .crt::after {
            content: "";
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
            animation: flicker 3.2s ease-in-out infinite;
        }

        @keyframes scan {
            from { background-position: 0 0; }
            to { background-position: 0 120px; }
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.85; }
            40% { opacity: 1; }
            42% { opacity: 0.7; }
            44% { opacity: 1; }
        }

        /* Layer 3: desktop files */
        .files {
            position: absolute;
            z-index: 3;
            top: 48px;
            right: 40px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .file {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 220px;
            gap: 8px;
            color: #f4f4f4;
            text-decoration: none;
            text-shadow: 0 1px 4px #000;
            cursor: pointer;
            background: none;
            border: 0;
            font: inherit;
        }

        .file:focus-visible .file-icon,
        .file:hover .file-icon {
            outline: 1px solid rgba(255, 255, 255, 0.55);
            outline-offset: 2px;
        }

        .file-icon {
            width: 56px;
            height: 68px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
        }

        .file-label {
            font-size: 16px;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .brand {
            position: absolute;
            z-index: 3;
            top: 40px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: #fff;
            background: none;
            border: 0;
            padding: 0;
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: none;
            border: 1px solid rgba(255,255,255,0.55);
            flex: none;
        }

        .brand-mark span {
            font-family: Georgia, "Noto Serif", serif;
            font-style: italic;
            font-weight: 700;
            font-size: 28px;
            line-height: 1;
            color: #fff;
        }

        .brand-wordmark {
            font-family: "Inter Tight", "Helvetica Neue", sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 1px 4px #000;
        }

        .upcoming {
            position: absolute;
            z-index: 3;
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            margin: 0;
            max-width: min(420px, calc(100% - 160px));
            color: #f4f4f4;
            text-shadow: 0 1px 4px #000;
        }

        .upcoming-title {
            margin: 0 0 12px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: lowercase;
        }

        .upcoming-list {
            margin: 0;
            padding-left: 1.15em;
            font-size: 16px;
            line-height: 1.7;
        }

        /* File window overlay — default is a fitted card, not fullscreen */
        .window {
            display: none;
            position: absolute;
            z-index: 4;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(720px, calc(100% - 80px));
            height: min(820px, calc(100% - 80px));
            background: #111;
            border: 1px solid #3a3a3a;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
        }

        .window.open { display: flex; flex-direction: column; }

        .window.maximized {
            inset: 12px;
            top: 12px;
            left: 12px;
            transform: none;
            width: auto;
            height: auto;
        }

        .window-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #1c1c1c;
            border-bottom: 1px solid #333;
            font-size: 16px;
            flex: none;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .window-max,
        .window-close {
            color: #ddd;
            background: #333;
            border: 0;
            width: 22px;
            height: 22px;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            font: inherit;
        }

        .window-max:hover,
        .window-close:hover {
            background: #444;
        }

        .window iframe {
            flex: 1;
            width: 100%;
            border: 0;
            background: #0a0a0a;
        }

        .file-icon-wrap {
            position: relative;
            width: 56px;
            height: 68px;
        }

        .file-icon-wrap .file-icon {
            width: 56px;
            height: 68px;
        }

        .lock-badge {
            position: absolute;
            right: -6px;
            bottom: -4px;
            font-size: 14px;
            line-height: 1;
            text-shadow: 0 1px 3px #000;
            pointer-events: none;
        }

        .file-label .lock-hint {
            opacity: 0.65;
            font-size: 12px;
            margin-left: 4px;
        }

        .pw-modal {
            display: none;
            position: absolute;
            z-index: 5;
            inset: 0;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
        }

        .pw-modal.open { display: flex; }

        .pw-card {
            width: min(360px, calc(100% - 48px));
            background: #111;
            border: 1px solid #3a3a3a;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
            color: #eee;
        }

        .pw-card-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #1c1c1c;
            border-bottom: 1px solid #333;
            font-size: 16px;
        }

        .pw-card-body {
            padding: 16px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pw-card-body label {
            font-size: 14px;
            opacity: 0.9;
        }

        .pw-card-body input[type="password"] {
            font: inherit;
            font-size: 16px;
            padding: 8px 10px;
            background: #0a0a0a;
            color: #eee;
            border: 1px solid #444;
            outline: none;
        }

        .pw-card-body input[type="password"]:focus {
            border-color: rgba(255, 255, 255, 0.55);
        }

        .pw-error {
            min-height: 1.2em;
            font-size: 13px;
            color: #f66;
        }

        .pw-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .pw-actions button {
            font: inherit;
            font-size: 14px;
            padding: 6px 12px;
            cursor: pointer;
            color: #ddd;
            background: #333;
            border: 0;
        }

        .pw-actions button:hover { background: #444; }

        .pw-actions .pw-ok {
            background: #3a3a3a;
        }
    </style>
</head>
<body>
    <div class="desktop">
        <div class="wallpaper" aria-hidden="true"></div>
        <div class="crt" aria-hidden="true"></div>

        <div class="brand" aria-label="Travers'n Spaces">
            <div class="brand-mark" aria-hidden="true"><span>TS</span></div>
            <div class="brand-wordmark">Travers'n Spaces</div>
        </div>

        <div class="upcoming">
            <p class="upcoming-title">upcoming</p>
            <ul class="upcoming-list">
                <li>august 26: writing ch. 4</li>
                <li>september 9th: editing ep. 3 hotel lincoln</li>
                <li>september 23rd: editing ep. 4 mccorkle place</li>
            </ul>
        </div>

        <div class="files">
            <button class="file" type="button" data-open="ep. 2_roughCut" data-src="episode_02_card.html?v=11">
                <img class="file-icon" src="assets/podcast_mic_icon.png" width="56" height="68" alt="" />
                <span class="file-label">ep. 2_roughCut</span>
            </button>
            <button class="file" type="button" data-open="AAA Late Breaking Poster" data-src="assets/Soundcestral%20Remembrance%20(4)_Poster.pdf">
                <img class="file-icon" src="assets/doc_icon.png" width="56" height="68" alt="" />
                <span class="file-label">AAA Late Breaking Poster</span>
            </button>
            <button class="file" type="button" data-open="Traversing Spaces slides" data-src="slides/traversing-spaces/">
                <img class="file-icon" src="assets/doc_icon.png" width="56" height="68" alt="" />
                <span class="file-label">Traversing Spaces slides</span>
            </button>
            <button class="file" type="button" data-open="Build Breakdown Script" data-src="prompts/build-breakdown-prompt.html" data-lock="05cb1e47605ae5cbf4d04b428a2a5086579ab13f80e7af57fe79faf58ff32ca4">
                <span class="file-icon-wrap">
                    <img class="file-icon" src="assets/doc_icon.png" width="56" height="68" alt="" />
                    <span class="lock-badge" aria-hidden="true">🔒</span>
                </span>
                <span class="file-label">Build Breakdown Script <span class="lock-hint">locked</span></span>
            </button>
        </div>

        <div class="window" id="file-window" role="dialog" aria-label="ep. 2_roughCut">
            <div class="window-bar">
                <span id="window-title">ep. 2_roughCut</span>
                <div class="window-controls">
                    <button class="window-max" type="button" aria-label="Full screen" aria-pressed="false" title="Full screen">□</button>
                    <button class="window-close" type="button" aria-label="Close">×</button>
                </div>
            </div>
            <iframe id="window-frame" title="ep. 2_roughCut"></iframe>
        </div>

        <div class="pw-modal" id="pw-modal" role="dialog" aria-modal="true" aria-labelledby="pw-title">
            <div class="pw-card">
                <div class="pw-card-bar">
                    <span id="pw-title">Build Breakdown Script</span>
                    <button class="window-close" type="button" id="pw-close" aria-label="Close">×</button>
                </div>
                <form class="pw-card-body" id="pw-form">
                    <label for="pw-input">password</label>
                    <input id="pw-input" name="password" type="password" autocomplete="current-password" required />
                    <div class="pw-error" id="pw-error" aria-live="polite"></div>
                    <div class="pw-actions">
                        <button type="button" id="pw-cancel">cancel</button>
                        <button type="submit" class="pw-ok">unlock</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const win = document.getElementById("file-window");
        const frame = document.getElementById("window-frame");
        const title = document.getElementById("window-title");
        const maxBtn = document.querySelector(".window-max");

        function setMaximized(on) {
            win.classList.toggle("maximized", on);
            maxBtn.setAttribute("aria-pressed", on ? "true" : "false");
            maxBtn.setAttribute("aria-label", on ? "Restore window" : "Full screen");
            maxBtn.title = on ? "Restore window" : "Full screen";
            maxBtn.textContent = on ? "❐" : "□";
            requestAnimationFrame(function () {
                if (frame.contentWindow) {
                    frame.contentWindow.dispatchEvent(new Event("resize"));
                }
            });
        }

        const pwModal = document.getElementById("pw-modal");
        const pwForm = document.getElementById("pw-form");
        const pwInput = document.getElementById("pw-input");
        const pwError = document.getElementById("pw-error");
        let pendingBtn = null;

        function openFile(btn) {
            title.textContent = btn.dataset.open;
            win.setAttribute("aria-label", btn.dataset.open);
            frame.title = btn.dataset.open;
            setMaximized(false);
            frame.src = btn.dataset.src;
            win.classList.add("open");
        }

        function closePw() {
            pwModal.classList.remove("open");
            pwError.textContent = "";
            pwInput.value = "";
            pendingBtn = null;
        }

        function showPw(btn) {
            pendingBtn = btn;
            document.getElementById("pw-title").textContent = btn.dataset.open;
            pwError.textContent = "";
            pwInput.value = "";
            pwModal.classList.add("open");
            requestAnimationFrame(function () { pwInput.focus(); });
        }

        async function sha256Hex(text) {
            const data = new TextEncoder().encode(text);
            const buf = await crypto.subtle.digest("SHA-256", data);
            return Array.from(new Uint8Array(buf)).map(function (b) {
                return b.toString(16).padStart(2, "0");
            }).join("");
        }

        document.querySelectorAll("[data-open]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                if (btn.dataset.lock) {
                    showPw(btn);
                    return;
                }
                openFile(btn);
            });
        });

        pwForm.addEventListener("submit", async function (e) {
            e.preventDefault();
            if (!pendingBtn) return;
            const guess = pwInput.value;
            pwError.textContent = "";
            try {
                const hex = await sha256Hex(guess);
                if (hex === pendingBtn.dataset.lock) {
                    const btn = pendingBtn;
                    closePw();
                    openFile(btn);
                } else {
                    pwError.textContent = "wrong password";
                    pwInput.select();
                }
            } catch (err) {
                pwError.textContent = "could not check password";
            }
        });

        document.getElementById("pw-cancel").addEventListener("click", closePw);
        document.getElementById("pw-close").addEventListener("click", closePw);
        pwModal.addEventListener("click", function (e) {
            if (e.target === pwModal) closePw();
        });

        maxBtn.addEventListener("click", function () {
            setMaximized(!win.classList.contains("maximized"));
        });

        document.querySelector(".window-close").addEventListener("click", function () {
            win.classList.remove("open");
            setMaximized(false);
            frame.src = "about:blank";
        });
    </script>
</body>
</html>
